AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS-first LeakGuard prototype

Parameters:
  AlertEmailEndpoint:
    Type: String
    Default: ""
    Description: Optional email address subscribed to LeakGuard SNS alerts.
  GitHubWebhookSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional GitHub webhook secret used to verify X-Hub-Signature-256.
  GitHubToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional GitHub token for Compare API calls. Leave blank to use demo inline diffs only.
  AutoDisableMode:
    Type: String
    Default: "OFF"
    AllowedValues:
      - OFF
      - ALLOWLIST_HIGH_CONFIDENCE
    Description: Optional containment mode for automatically disabling verified leaked keys.

Conditions:
  HasAlertEmailEndpoint: !Not [!Equals [!Ref AlertEmailEndpoint, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        LEAK_FINDINGS_TABLE: !Ref LeakFindingsTable
        DELIVERIES_TABLE: !Ref WebhookDeliveriesTable
        EVIDENCE_BUCKET: !Ref EvidenceBucket
        SCAN_QUEUE_URL: !Ref LeakGuardScanQueue
        STATUS_INDEX_NAME: status-receivedAt-index
        DELIVERY_TTL_DAYS: "14"
        GITHUB_WEBHOOK_SECRET: !Ref GitHubWebhookSecret
        GITHUB_TOKEN: !Ref GitHubToken
        DISABLE_ALLOWLIST_USERS: ""
        AUTO_DISABLE_MODE: !Ref AutoDisableMode
        ALERT_TOPIC_ARN: !If [HasAlertEmailEndpoint, !Ref LeakGuardAlertsTopic, ""]

Resources:
  LeakGuardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
          - x-hub-signature-256
          - x-github-delivery
          - x-github-event
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

  LeakGuardScanQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60

  LeakGuardAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"

  LeakGuardAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmailEndpoint
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmailEndpoint
      TopicArn: !Ref LeakGuardAlertsTopic

  LeakFindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: receivedAt
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-receivedAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: receivedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  WebhookDeliveriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deliveryId
          AttributeType: S
      KeySchema:
        - AttributeName: deliveryId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.ingest.app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebhookDeliveriesTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt LeakGuardScanQueue.QueueName
      Events:
        GitHubWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeakGuardApi
            Method: POST
            Path: /github/webhook

  ScanWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.scan_worker.app.lambda_handler
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt LeakGuardScanQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref LeakFindingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WebhookDeliveriesTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
        - Statement:
            - Effect: Allow
              Action:
                - iam:GetAccessKeyLastUsed
                - iam:UpdateAccessKey
              Resource: "*"
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref LeakGuardAlertsTopic
      Events:
        ScanQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt LeakGuardScanQueue.Arn
            BatchSize: 5
            ScalingConfig:
              MaximumConcurrency: 2

  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.list_events.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LeakFindingsTable
      Events:
        ListFindings:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeakGuardApi
            Method: GET
            Path: /findings

  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.get_event.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LeakFindingsTable
        - S3ReadPolicy:
            BucketName: !Ref EvidenceBucket
      Events:
        GetFinding:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeakGuardApi
            Method: GET
            Path: /findings/{findingId}

  ReplayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.replay.app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeakFindingsTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
        - Statement:
            - Effect: Allow
              Action:
                - iam:UpdateAccessKey
              Resource: "*"
      Events:
        ActionFinding:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeakGuardApi
            Method: POST
            Path: /findings/{findingId}/action

Outputs:
  ApiBaseUrl:
    Description: Public URL for the HTTP API.
    Value: !Sub "https://${LeakGuardApi}.execute-api.${AWS::Region}.amazonaws.com"

  EvidenceBucketName:
    Description: Bucket storing webhook payloads and action artifacts.
    Value: !Ref EvidenceBucket

  LeakFindingsTableName:
    Description: DynamoDB table storing leak findings and status changes.
    Value: !Ref LeakFindingsTable

  WebhookDeliveriesTableName:
    Description: DynamoDB table storing GitHub delivery dedupe state with TTL.
    Value: !Ref WebhookDeliveriesTable

  ScanQueueUrl:
    Description: SQS queue used to decouple webhook ingress from diff scanning.
    Value: !Ref LeakGuardScanQueue

  AlertTopicArn:
    Description: SNS topic used for finding alerts.
    Value: !Ref LeakGuardAlertsTopic
