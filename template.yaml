AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS-first LeakGuard prototype

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        LEAK_FINDINGS_TABLE: !Ref LeakFindingsTable
        EVIDENCE_BUCKET: !Ref EvidenceBucket
        STATUS_INDEX_NAME: status-receivedAt-index
        GITHUB_WEBHOOK_SECRET: ""
        GITHUB_TOKEN: ""

Resources:
  LeakGuardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
          - x-hub-signature-256
          - x-github-delivery
          - x-github-event
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

  LeakFindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: receivedAt
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-receivedAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: receivedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.ingest.app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeakFindingsTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
        - Statement:
            - Effect: Allow
              Action:
                - iam:GetAccessKeyLastUsed
              Resource: "*"
      Events:
        GitHubWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeakGuardApi
            Method: POST
            Path: /github/webhook

  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.list_events.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LeakFindingsTable
      Events:
        ListFindings:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeakGuardApi
            Method: GET
            Path: /findings

  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.get_event.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LeakFindingsTable
        - S3ReadPolicy:
            BucketName: !Ref EvidenceBucket
      Events:
        GetFinding:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeakGuardApi
            Method: GET
            Path: /findings/{findingId}

  ReplayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.replay.app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeakFindingsTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
        - Statement:
            - Effect: Allow
              Action:
                - iam:UpdateAccessKey
              Resource: "*"
      Events:
        ActionFinding:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeakGuardApi
            Method: POST
            Path: /findings/{findingId}/action

Outputs:
  ApiBaseUrl:
    Description: Public URL for the HTTP API.
    Value: !Sub "https://${LeakGuardApi}.execute-api.${AWS::Region}.amazonaws.com"

  EvidenceBucketName:
    Description: Bucket storing webhook payloads and action artifacts.
    Value: !Ref EvidenceBucket

  LeakFindingsTableName:
    Description: DynamoDB table storing leak findings and status changes.
    Value: !Ref LeakFindingsTable
